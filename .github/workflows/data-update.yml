name: Data Update

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update data from OpenAlex and GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: raises Semantic Scholar fallback limits. Unset = anonymous (slower).
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: node scripts/update-data.mjs
      - name: Validate
        run: node scripts/validate.mjs
      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): daily update $(date -u +%F)"
            git push
          fi
